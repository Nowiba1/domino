<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dominoes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --felt:#1a6b3c;--felt-d:#0f3d22;--felt-dd:#061408;
  --gold:#c9a84c;--gold-l:#f0d278;--gold-d:#8a6520;
  --tile-bg:#faf5ea;--tile-bd:#c4b27a;--tile-dot:#1a1108;--tile-ln:#7a6040;
  --hl:#ffe84d;--hl-g:rgba(255,232,77,.6);
  --txt:#f0ead8;--txt-dim:rgba(228,210,165,.55);--txt-gold:#f0d278;
  --sh:0 4px 16px rgba(0,0,0,.52);--sh-lg:0 14px 44px rgba(0,0,0,.68);
  --r:9px;--r-lg:16px;
  --F:'Cinzel',Georgia,serif;--U:'Inter','Trebuchet MS',sans-serif;
  --ta:.15s;--tm:.3s;--ts:.48s;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--U);background:var(--felt-dd);
  color:var(--txt);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none}
canvas#pcv{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.28}
.sc{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  transition:opacity var(--ts),visibility var(--ts);z-index:10}
.sc.off{opacity:0;visibility:hidden;pointer-events:none}

/* ── LOADING ── */
#LS{background:var(--felt-dd);flex-direction:column;gap:20px;z-index:300}
.ll{font-family:var(--F);font-size:2.5rem;color:var(--gold-l);letter-spacing:.14em;
  text-align:center;animation:llp 1.3s ease infinite}
@keyframes llp{0%,100%{opacity:.5}50%{opacity:1}}
.lbw{width:220px;height:5px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
.lb{height:100%;width:0%;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));
  border-radius:5px;transition:width .06s linear}
.lt{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--txt-dim);text-align:center}

/* ── MENU ── */
#MS{flex-direction:column;gap:14px;
  background:radial-gradient(ellipse at 50% 35%,#1f6a40 0%,#0d4020 50%,#040d06 100%)}
#MS::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 40% 26% at 16% 16%,rgba(201,168,76,.08) 0%,transparent 55%),
    radial-gradient(ellipse 30% 20% at 84% 80%,rgba(20,105,55,.12) 0%,transparent 55%)}
#MS::after{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.026) 3px,rgba(0,0,0,.026) 4px),
    repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(0,0,0,.026) 3px,rgba(0,0,0,.026) 4px)}
.logo{text-align:center;position:relative;z-index:1}
.logo h1{font-family:var(--F);font-size:clamp(2.4rem,7vw,4rem);letter-spacing:.13em;color:transparent;
  background:linear-gradient(155deg,#f8e488 0%,#c9a84c 42%,#e8c455 72%,#fae898 100%);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 3px 22px rgba(201,168,76,.55));animation:shim 4s ease infinite}
@keyframes shim{0%,100%{filter:drop-shadow(0 3px 22px rgba(201,168,76,.55))}
  50%{filter:drop-shadow(0 3px 40px rgba(201,168,76,.9))}}
.logo p{font-size:clamp(.6rem,1.8vw,.78rem);letter-spacing:.32em;text-transform:uppercase;
  color:rgba(232,201,109,.4);margin-top:5px}
#deco{display:flex;gap:5px;justify-content:center;position:relative;z-index:1;
  animation:sUp .7s ease .22s both}
@keyframes sUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mp{background:rgba(3,14,6,.76);border:1px solid rgba(201,168,76,.2);border-radius:var(--r-lg);
  padding:20px 24px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  width:min(390px,93vw);display:flex;flex-direction:column;gap:9px;position:relative;z-index:1;
  box-shadow:var(--sh-lg),inset 0 1px 0 rgba(255,255,255,.04);animation:pIn .55s ease .1s both}
@keyframes pIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.mlbl{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(201,168,76,.56);margin-bottom:1px;font-weight:600}
.mbtn{width:100%;padding:12px 14px;
  background:linear-gradient(135deg,rgba(24,80,46,.8),rgba(10,40,22,.92));
  border:1px solid rgba(201,168,76,.18);border-radius:11px;color:var(--txt);
  font-size:.87rem;font-family:var(--U);cursor:pointer;transition:all var(--ta);
  text-align:left;display:flex;align-items:center;gap:11px;position:relative;overflow:hidden}
.mbtn::after{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(201,168,76,.09) 0%,transparent 55%);
  opacity:0;transition:opacity var(--ta)}
.mbtn:hover{border-color:rgba(201,168,76,.5);transform:translateX(4px) scale(1.01);
  box-shadow:0 5px 22px rgba(0,0,0,.42)}
.mbtn:hover::after{opacity:1}
.mbtn:active{transform:translateX(2px) scale(.99)}
.mi{font-size:1.22rem;min-width:25px;flex-shrink:0}
.mt{font-weight:700;color:var(--gold-l);display:block;font-size:.88rem}
.md{font-size:.68rem;color:rgba(185,182,158,.62);display:block;margin-top:2px}
.mbg{margin-left:auto;font-size:.6rem;letter-spacing:.1em;flex-shrink:0;
  background:rgba(201,168,76,.15);color:var(--gold-l);
  border:1px solid rgba(201,168,76,.26);border-radius:18px;padding:2px 8px}
.mfoot{display:flex;justify-content:center;gap:10px;position:relative;z-index:1}
.mfbtn{background:rgba(0,0,0,.36);border:1px solid rgba(255,255,255,.1);border-radius:8px;
  color:var(--txt-dim);font-size:.73rem;font-family:var(--U);padding:6px 14px;cursor:pointer;
  transition:all var(--ta);display:flex;align-items:center;gap:6px}
.mfbtn:hover{border-color:rgba(201,168,76,.35);color:var(--txt-gold)}

/* ── HUD ── */
#hud{position:fixed;top:0;left:0;right:0;height:50px;
  background:rgba(3,10,5,.86);border-bottom:1px solid rgba(201,168,76,.14);
  display:flex;align-items:center;padding:0 12px;gap:9px;
  z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 2px 16px rgba(0,0,0,.42)}
#hud-title{font-family:var(--F);font-size:.88rem;color:var(--gold-l);
  letter-spacing:.09em;white-space:nowrap;flex-shrink:0}
#hscores{display:flex;gap:5px;flex:1;overflow:hidden}
.chip{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.052);
  border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:3px 9px;
  font-size:.7rem;white-space:nowrap;transition:all var(--tm);flex-shrink:0;cursor:default}
.chip.act{background:rgba(201,168,76,.18);border-color:var(--gold);
  color:var(--gold-l);animation:cg 2.2s ease infinite}
@keyframes cg{0%,100%{box-shadow:0 0 7px rgba(201,168,76,.18)}
  50%{box-shadow:0 0 18px rgba(201,168,76,.52)}}
.chip .cn{font-weight:700;font-size:.72rem}
.chip .cs{background:rgba(0,0,0,.28);border-radius:10px;
  padding:1px 5px;font-size:.63rem;color:var(--gold-l);font-weight:600}
.chip .ct{font-size:.58rem;color:rgba(160,155,132,.48)}
.hbtns{display:flex;gap:5px;flex-shrink:0}
.hbtn{border-radius:7px;padding:4px 10px;font-size:.7rem;cursor:pointer;
  font-family:var(--U);font-weight:600;transition:all var(--ta);white-space:nowrap;border:1px solid}
#hbtn-menu{background:rgba(132,30,30,.74);border-color:rgba(210,70,70,.28);color:#f5c8c8}
#hbtn-menu:hover{background:rgba(175,46,46,.9);border-color:rgba(210,70,70,.6)}
#hbtn-snd{background:rgba(36,36,36,.74);border-color:rgba(110,108,86,.28);
  color:var(--txt-dim);min-width:32px;text-align:center}
#hbtn-snd:hover{background:rgba(56,56,52,.9);color:var(--txt)}
#hbtn-zoom-in,#hbtn-zoom-out{background:rgba(30,70,44,.74);border-color:rgba(80,160,100,.28);
  color:rgba(180,230,195,.8);min-width:30px;text-align:center;font-size:.85rem;padding:4px 8px}
#hbtn-zoom-in:hover,#hbtn-zoom-out:hover{background:rgba(40,100,60,.9);color:#fff}

/* ── GAME SCREEN ── */
#GS{flex-direction:column;overflow:hidden;
  background:radial-gradient(ellipse 110% 88% at 50% 28%,var(--felt) 0%,var(--felt-d) 55%,var(--felt-dd) 100%)}
#GS::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(0,0,0,.02) 4px,rgba(0,0,0,.02) 5px),
    repeating-linear-gradient(90deg,transparent,transparent 4px,rgba(0,0,0,.02) 4px,rgba(0,0,0,.02) 5px)}
.fcorn{position:fixed;width:70px;height:70px;pointer-events:none;z-index:2;opacity:.18}
.fc-tl{top:50px;left:0}.fc-tr{top:50px;right:0;transform:scaleX(-1)}
.fc-bl{bottom:142px;left:0;transform:scaleY(-1)}.fc-br{bottom:142px;right:0;transform:scale(-1)}

/* Turn badge */
#tbadge{position:fixed;top:60px;left:50%;transform:translateX(-50%);
  border-radius:24px;padding:5px 18px 5px 12px;font-size:.7rem;font-weight:700;
  letter-spacing:.1em;z-index:46;white-space:nowrap;
  transition:all var(--tm);border:1.5px solid;
  display:flex;align-items:center;gap:7px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#tbadge.off{opacity:0;pointer-events:none}
#tbadge.yours{background:rgba(26,90,195,.24);border-color:#5bbeff;color:#8dd4ff}
#tbadge.theirs{background:rgba(175,136,26,.2);border-color:var(--gold);color:var(--gold-l)}
.tbdot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;
  animation:tbp 1.4s ease infinite}
@keyframes tbp{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}

/* ── TABLE AREA ── */
#table{position:fixed;top:50px;left:0;right:0;bottom:0;overflow:hidden;z-index:1;
  touch-action:none}

/* ── BOT ZONES ── */
.bz{position:absolute;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:4px;z-index:14;pointer-events:none}
.bzav{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:1rem;border:2px solid rgba(201,168,76,.22);
  background:rgba(0,0,0,.54);flex-shrink:0;transition:all var(--tm)}
.bzav.on{border-color:var(--gold);box-shadow:0 0 14px rgba(201,168,76,.44)}
.bzinfo{text-align:center}
.bzname{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(210,192,142,.68);font-weight:700}
.bzcnt{font-size:.54rem;color:rgba(160,152,115,.45)}
.bzh{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:170px}
.btbk{width:13px;height:24px;background:linear-gradient(155deg,#285035,#142b1c);
  border:1px solid rgba(201,168,76,.28);border-radius:3px;box-shadow:1px 2px 5px rgba(0,0,0,.5)}
.tdots{display:inline-flex;gap:3px;margin-left:3px;vertical-align:middle}
.tdots span{display:inline-block;width:4px;height:4px;border-radius:50%;
  background:var(--gold);animation:td 1.2s ease infinite}
.tdots span:nth-child(2){animation-delay:.2s}.tdots span:nth-child(3){animation-delay:.4s}
@keyframes td{0%,80%,100%{opacity:.18;transform:scale(.6)}40%{opacity:1;transform:scale(1)}}
#bz0{top:8px;left:50%;transform:translateX(-50%)}
#bz1{left:6px;top:50%;transform:translateY(-50%)}
#bz2{right:6px;top:50%;transform:translateY(-50%)}
#bz3{top:8px;left:24%;transform:translateX(-50%)}

/* ── BOARD VIEWPORT ── */
#bvp{position:absolute;top:72px;left:0;right:0;bottom:142px;overflow:hidden;
  touch-action:none}
#bcanvas{position:absolute;top:0;left:0;
  transform-origin:0 0;will-change:transform}
#board{position:absolute;top:0;left:0;
  width:5000px;height:3000px}

/* ── ZOOM CONTROLS ── */
#zoom-ctrl{position:absolute;bottom:8px;right:14px;display:flex;flex-direction:column;
  gap:4px;z-index:20}
.zb{width:32px;height:32px;background:rgba(3,14,6,.82);
  border:1px solid rgba(201,168,76,.25);border-radius:8px;
  color:var(--txt-gold);font-size:1rem;cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:all var(--ta);
  backdrop-filter:blur(6px)}
.zb:hover{background:rgba(28,80,46,.9);border-color:rgba(201,168,76,.5)}
.zb:active{transform:scale(.92)}
#zoom-pct{font-size:.58rem;color:var(--txt-dim);text-align:center;
  letter-spacing:.05em;background:rgba(3,14,6,.7);border-radius:5px;padding:2px 4px}

/* ── BONEYARD ── */
#byw{position:absolute;right:12px;top:76px;display:flex;
  flex-direction:column;align-items:center;gap:4px;z-index:20}
#byp{position:relative;width:42px;height:78px;cursor:pointer;flex-shrink:0;
  transition:transform var(--ta)}
#byp:hover{transform:scale(1.08) translateY(-2px)}
#byp:active{transform:scale(.95)}
.bycard{position:absolute;width:42px;height:78px;
  background:linear-gradient(145deg,#2b5438,#152d1e);
  border:2px solid rgba(201,168,76,.35);border-radius:8px;
  box-shadow:2px 3px 10px rgba(0,0,0,.54);
  background-image:radial-gradient(circle at 50% 50%,rgba(201,168,76,.05) 0%,transparent 60%),
    repeating-linear-gradient(45deg,rgba(201,168,76,.032) 0,rgba(201,168,76,.032) 2px,transparent 2px,transparent 9px)}
#by-count{font-size:.7rem;color:var(--txt-gold);font-weight:700;
  background:rgba(0,0,0,.52);border-radius:10px;padding:2px 8px;
  border:1px solid rgba(201,168,76,.18)}
#by-label{font-size:.52rem;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(168,150,98,.4)}

/* ── STATUS ── */
#statwrap{position:fixed;bottom:142px;left:50%;transform:translateX(-50%);
  z-index:40;max-width:94vw;pointer-events:none}
#stat{background:rgba(3,10,5,.86);border:1px solid rgba(201,168,76,.2);
  border-radius:22px;padding:5px 16px;font-size:.76rem;color:var(--txt-gold);
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 4px 16px rgba(0,0,0,.36);display:flex;align-items:center;gap:7px}
#stat-ic{font-size:.86rem;flex-shrink:0}
.stfl{animation:stf .42s ease}
@keyframes stf{0%{background:rgba(201,168,76,.22)}100%{background:rgba(3,10,5,.86)}}

/* ── PLAYER HAND ── */
#phw{position:fixed;bottom:0;left:0;right:0;height:138px;
  background:linear-gradient(to top,rgba(3,8,4,.95) 0%,rgba(3,8,4,.72) 60%,transparent 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:11px;z-index:30;pointer-events:none}
#ph-label{font-size:.56rem;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(168,165,140,.48);margin-bottom:7px;pointer-events:none}
#ph{display:flex;gap:8px;overflow-x:auto;padding:0 12px 3px;
  scrollbar-width:thin;scrollbar-color:rgba(201,168,76,.2) transparent;
  max-width:100%;pointer-events:all;-webkit-overflow-scrolling:touch}
#ph::-webkit-scrollbar{height:3px}
#ph::-webkit-scrollbar-thumb{background:rgba(201,168,76,.22);border-radius:2px}

/* ── SIDE BAR ── */
#sbar{position:fixed;bottom:152px;left:50%;transform:translateX(-50%);
  background:rgba(2,10,4,.97);border:1.5px solid var(--gold);border-radius:15px;
  padding:9px 16px;z-index:68;display:flex;gap:9px;align-items:center;
  font-size:.78rem;color:var(--txt-gold);white-space:nowrap;
  box-shadow:0 12px 42px rgba(0,0,0,.75),0 0 28px rgba(201,168,76,.14);
  animation:sbin .22s cubic-bezier(.34,1.56,.64,1) both}
@keyframes sbin{from{opacity:0;transform:translateX(-50%) scale(.85)}
  to{opacity:1;transform:translateX(-50%) scale(1)}}
#sbar.off{display:none}
.sbtn{border:1.5px solid;border-radius:8px;color:#fff;padding:5px 12px;cursor:pointer;
  font-family:var(--U);font-size:.76rem;font-weight:600;transition:all var(--ta);
  display:flex;align-items:center;gap:5px}
.sbtn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.sbtn:active{transform:translateY(0) scale(.96)}
.sbL{background:rgba(26,106,58,.82);border-color:#4db87a}
.sbR{background:rgba(26,60,118,.82);border-color:#5b9ee8}
.sbX{background:rgba(100,28,28,.82);border-color:#d05858}
.sblbl{font-size:.68rem;letter-spacing:.07em;color:rgba(201,168,76,.62)}

/* ── TILE ── */
.tile{display:inline-flex;flex-direction:column;align-items:center;
  justify-content:space-between;
  background:linear-gradient(148deg,#fdf8ee,#ede3cc);
  border:2px solid var(--tile-bd);border-radius:var(--r);
  box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.88);
  cursor:default;transition:transform var(--ta),box-shadow var(--ta),border-color var(--ta);
  flex-shrink:0;overflow:hidden;position:relative}
.tile::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(148deg,rgba(255,255,255,.46) 0%,transparent 52%);
  border-radius:calc(var(--r) - 2px)}
/* Hand sizes */
.tile.V{width:46px;height:88px;padding:6px 0}
.tile.H{width:88px;height:46px;flex-direction:row;padding:0 6px}
/* Board sizes */
.tile.BV{width:36px;height:68px;padding:4px 0;border-width:1.5px}
.tile.BH{width:68px;height:36px;flex-direction:row;padding:0 4px;border-width:1.5px}
.th{display:flex;align-items:center;justify-content:center;flex:1;width:100%}
.tile.H .th,.tile.BH .th{width:auto;height:100%}
.tile.V .tdv,.tile.BV .tdv{width:80%;height:1.5px;margin:0 auto;background:var(--tile-ln);flex-shrink:0}
.tile.H .tdv,.tile.BH .tdv{height:80%;width:1.5px;margin:auto 0;background:var(--tile-ln);flex-shrink:0}
.dg{display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  width:100%;height:100%;padding:3px}
.dr{display:flex;justify-content:space-evenly;width:100%}
.d{width:7px;height:7px;
  background:radial-gradient(circle at 35% 30%,#3d3022,#0e0c07);
  border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.44),inset 0 1px 1px rgba(255,255,255,.08)}
.ds{width:7px;height:7px}
.tile.BV .d,.tile.BH .d,.tile.BV .ds,.tile.BH .ds{width:5px;height:5px}

/* Playable */
.tile.play{border-color:var(--hl);cursor:pointer;
  box-shadow:0 0 0 2.5px var(--hl-g),var(--sh),inset 0 1px 0 rgba(255,255,255,.88);
  animation:tpla 2s ease infinite}
@keyframes tpla{
  0%,100%{box-shadow:0 0 0 2.5px var(--hl-g),var(--sh),inset 0 1px 0 rgba(255,255,255,.88)}
  50%{box-shadow:0 0 0 4px rgba(255,232,77,.75),0 6px 20px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.88)}}
.tile.play:hover{transform:translateY(-10px) scale(1.1) rotate(-1deg);
  box-shadow:0 18px 36px rgba(0,0,0,.56),0 0 0 3.5px var(--hl-g),inset 0 1px 0 rgba(255,255,255,.88);
  z-index:9;animation:none}
.tile.play:active{transform:translateY(-4px) scale(1.05)}
.tile.sel{border-color:#5bc0ff;cursor:pointer;
  box-shadow:0 0 0 3px rgba(91,192,255,.44),0 10px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.88);
  transform:translateY(-10px) scale(1.05);animation:none;z-index:8}

/* Board placed tiles – absolute positioned inside #board */
.btile{position:absolute;animation:tpl .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes tpl{from{opacity:0;transform:scale(.42) rotate(-16deg)}
  to{opacity:1;transform:scale(1) rotate(0)}}

/* ── SCORE POP ── */
.spop{position:fixed;font-family:var(--F);font-size:1.5rem;font-weight:700;
  color:var(--gold-l);pointer-events:none;z-index:220;
  text-shadow:0 2px 10px rgba(0,0,0,.6);animation:spa 1.3s ease forwards}
@keyframes spa{0%{opacity:1;transform:translateY(0) scale(.7)}
  35%{opacity:1;transform:translateY(-38px) scale(1.08)}
  100%{opacity:0;transform:translateY(-90px) scale(.85)}}

/* ── TOASTS ── */
#toasts{position:fixed;top:60px;right:14px;z-index:260;
  display:flex;flex-direction:column;gap:5px;pointer-events:none}
.toast{background:rgba(3,12,5,.92);border:1px solid rgba(201,168,76,.18);
  border-radius:10px;padding:7px 13px;font-size:.74rem;color:var(--txt);
  max-width:240px;backdrop-filter:blur(8px);box-shadow:var(--sh);
  animation:tin .26s ease both}
.toast.out{animation:tout .26s ease both}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes tout{from{opacity:1;transform:none}to{opacity:0;transform:translateX(20px)}}

/* ── GAME OVER ── */
#gov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;
  align-items:center;justify-content:center;z-index:290;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}

#goc{background:linear-gradient(148deg,#1b4826 0%,#0d2414 55%,#060d08 100%);

@keyframes goin{from{opacity:0;transform:scale(.6) translateY(28px)}
  to{opacity:1;transform:scale(1) translateY(0)}}
#goc::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.1) 0%,transparent 52%)}
#cnfc{position:absolute;inset:0;pointer-events:none;border-radius:18px}
#go-trophy{font-size:3rem;display:block;margin-bottom:6px;
  animation:trb .52s ease .22s both}
@keyframes trb{from{transform:scale(0) rotate(-24deg)}to{transform:scale(1) rotate(0)}}
#go-title{font-family:var(--F);font-size:1.85rem;color:var(--gold-l);margin-bottom:7px;line-height:1.1}

.godiv{width:55%;height:1px;margin:0 auto 13px;

.grow{display:flex;justify-content:space-between;align-items:center;

.grow:last-child{border:none}.grow.w{color:var(--gold-l);font-weight:700}

  background:linear-gradient(135deg,#c9a84c 0%,#a67c22 100%);

.rulebox{background:linear-gradient(148deg,#1b4826,#0d2414);

/* ── STATS BADGE ── */

  .tile.V{width:36px;height:70px}.tile.H{width:70px;height:36px}

<div id="toasts"></div>

<script>
/* ================================================================
   DOMINOES — Complete Professional Edition
   Board Layout: Real snake pattern — Right → Down → Left → Up → …
   Doubles: perpendicular to chain direction
   Features: pinch-zoom, wheel-zoom, drag-pan, touch support,
             snake layout, stats tracking, sound, animations
================================================================ */

/* ── AUDIO ENGINE ── */
var AC=null,soundOn=true;
function getAC(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}; return AC}
function tone(f,type,dur,vol,atk){
  if(!soundOn)return; vol=vol||.15; atk=atk||.005;
  try{var c=getAC();if(!c)return;
    var o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=type||'sine';o.frequency.value=f;
    var t=c.currentTime;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t);o.stop(t+dur+.05);}catch(e){}}
function nz(dur,vol,bpf){
  if(!soundOn)return; vol=vol||.07; bpf=bpf||1100;
  try{var c=getAC();if(!c)return;
    var sr=c.sampleRate,buf=c.createBuffer(1,sr*dur,sr),d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    var src=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
    fl.type='bandpass';fl.frequency.value=bpf;fl.Q.value=.7;
    src.buffer=buf;src.connect(fl);fl.connect(g);g.connect(c.destination);
    var t=c.currentTime;g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.start(t);src.stop(t+dur+.05);}catch(e){}}
var SFX={
  place:function(){nz(.042,.24,880);tone(165,'sine',.07,.05)},
  draw:function(){nz(.06,.12,1250);tone(295,'sine',.09,.03)},
  yours:function(){tone(660,'sine',.11,.12);setTimeout(function(){tone(880,'sine',.17,.1)},105)},
  hover:function(){tone(540,'sine',.05,.032)},
  click:function(){tone(420,'sine',.044,.055)},
  win:function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,'triangle',.26,.14)},i*92)})},
  lose:function(){[390,328,260].forEach(function(f,i){setTimeout(function(){tone(f,'sawtooth',.28,.1)},i*105)})},
  bad:function(){tone(210,'sawtooth',.12,.1)},
  pass:function(){tone(320,'sine',.09,.07);setTimeout(function(){tone(255,'sine',.14,.05)},82)},
  shuffle:function(){for(var i=0;i<9;i++)(function(j){setTimeout(function(){nz(.038,.09,800+j*100)},j*52)})(i)}
};
function toggleSound(){
  soundOn=!soundOn;SFX.click();
  var label=soundOn?'🔊 Sound On':'🔇 Sound Off';
  var hb=document.getElementById('hbtn-snd');
  var ms=document.getElementById('ms-snd');
  if(hb)hb.textContent=soundOn?'🔊':'🔇';
  if(ms)ms.textContent=label;
  toast(soundOn?'🔊 Sound enabled':'🔇 Sound muted');
}

/* ── PARTICLES ── */
(function(){
  var cv=document.getElementById('pcv'),ctx=cv.getContext('2d'),W,H,pts;
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight}
  function mkp(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,
    vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,a:Math.random(),
    va:(Math.random()-.5)*.005,gold:Math.random()>.6}}
  function init(){resize();pts=[];for(var i=0;i<50;i++)pts.push(mkp())}
  function frame(){ctx.clearRect(0,0,W,H);
    for(var i=0;i<pts.length;i++){var p=pts[i];
      p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
      if(p.a<0)p.va=Math.abs(p.va);if(p.a>1)p.va=-Math.abs(p.va);
      if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;
      if(p.y<-5)p.y=H+5;if(p.y>H+5)p.y=-5;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.gold?'rgba(201,168,76,'+Math.max(0,p.a*.52)+')':'rgba(238,228,198,'+Math.max(0,p.a*.35)+')';
      ctx.fill()}requestAnimationFrame(frame)}
  window.addEventListener('resize',resize);init();frame();
})();

/* ── DOT PATTERNS ── */
var DP={
  0:[],1:[[0,1,0]],2:[[0,1,0],[0,0,0],[0,1,0]],3:[[0,1,0],[0,1,0],[0,1,0]],
  4:[[1,0,1],[0,0,0],[1,0,1]],5:[[1,0,1],[0,1,0],[1,0,1]],6:[[1,0,1],[1,0,1],[1,0,1]]
};
function buildDots(n){
  var dg=document.createElement('div');dg.className='dg';
  var rows=DP[n]||[];if(!rows.length)return dg;
  for(var i=0;i<rows.length;i++){
    var r=document.createElement('div');r.className='dr';
    for(var j=0;j<rows[i].length;j++){var c=document.createElement('div');c.className=rows[i][j]?'d':'ds';r.appendChild(c)}
    dg.appendChild(r)}return dg}

var hTmr=null;
function mkTile(a,b,opts){
  opts=opts||{};
  var el=document.createElement('div');
  var isH=opts.horiz,brd=opts.board;
  el.className='tile '+(isH?(brd?'BH':'H'):(brd?'BV':'V'));
  if(opts.playable)el.classList.add('play');
  if(opts.selected)el.classList.add('sel');
  if(opts.onclick)el.addEventListener('click',opts.onclick);
  if(opts.playable)el.addEventListener('mouseenter',function(){clearTimeout(hTmr);hTmr=setTimeout(function(){SFX.hover()},85)});
  var ha=document.createElement('div');ha.className='th';ha.appendChild(buildDots(a));
  var dv=document.createElement('div');dv.className='tdv';
  var hb=document.createElement('div');hb.className='th';hb.appendChild(buildDots(b));
  el.appendChild(ha);el.appendChild(dv);el.appendChild(hb);
  return el}

/* ── GAME DATA ── */
var BOTS=[{name:'Ace',emoji:'🤖',color:'#4da6e8'},{name:'Rex',emoji:'🦊',color:'#e8844d'},
  {name:'Max',emoji:'🦁',color:'#c9a84c'},{name:'Zoe',emoji:'🐺',color:'#a04de8'}];
var BZ_IDS=['bz0','bz1','bz2','bz3'];
var BZ_STYLES={bz0:'top:8px;left:50%;transform:translateX(-50%)',
  bz1:'left:6px;top:50%;transform:translateY(-50%)',
  bz2:'right:6px;top:50%;transform:translateY(-50%)',
  bz3:'top:8px;left:24%;transform:translateX(-50%)'};
var BZ_SLOTS={1:['bz0'],2:['bz0','bz2'],3:['bz0','bz1','bz2'],4:['bz3','bz0','bz1','bz2']};

function genSet(){var t=[];for(var a=0;a<=6;a++)for(var b=a;b<=6;b++)t.push({a:a,b:b});return t}
function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=0|Math.random()*(i+1);var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp}return arr}
function pip(t){return t.a+t.b}
function hpip(p){return p.hand.reduce(function(s,t){return s+pip(t)},0)}

/* ── GLOBAL STATE ── */
var G={},TMR=null,SEL=-1;
/* Stats */
var STATS={wins:0,losses:0,gamesPlayed:0,tilesPlayed:0,roundsPlayed:0};

/* ── BOARD LAYOUT ENGINE ──────────────────────────────────────────────
   REAL SNAKE PATTERN — like actual dominoes table:
   Start center. Go RIGHT. When right arm hits wall boundary → turn DOWN.
   Then go LEFT. Hit wall → turn UP. Etc.
   Each "arm" is a segment in one direction.
   We track:
     chain[] = array of placed tile records
     Each record: {a, b, x, y, dir, dbl}
       dir: 'R'|'L'|'U'|'D' = direction tile extends in
   Open ends: left end (head) and right end (tail)
   Each end has: {x, y, openVal, dir}  where dir = incoming direction
──────────────────────────────────────────────────────────────────── */

/* Tile dimensions on board */
var TW=68,TH=36; /* normal tile: long=68, short=36 */
var DW=36,DH=68; /* double tile (rotated 90°): long=68, short=36 → w=36,h=68 */
/* Gap between tiles */
var GAP=2;
/* Virtual board center */
var BCX=2500,BCY=1500;
/* Snake boundary margin from center (half-width of snake region) */
var SNAKE_W=600; /* go this many px right/left before turning */
var SNAKE_H=240; /* row height for snake turns */

function initGame(numBots){
  var tiles=shuffle(genSet()),total=1+numBots,hs=total<=2?7:5;
  var players=[];
  for(var i=0;i<total;i++){
    players.push({id:i,name:i===0?'You':BOTS[i-1].name,emoji:i===0?'🧑':BOTS[i-1].emoji,
      color:i===0?'#4ddd88':BOTS[i-1].color,bot:i!==0,hand:tiles.splice(0,hs),score:0})}
  /* Determine first player */
  var first=-1,hd=-1;
  for(var pi=0;pi<players.length;pi++)for(var ti=0;ti<players[pi].hand.length;ti++){
    var t=players[pi].hand[ti];if(t.a===t.b&&t.a>hd){hd=t.a;first=pi}}
  if(first===-1){var maxP=-1;for(var pi2=0;pi2<players.length;pi2++)for(var ti2=0;ti2<players[pi2].hand.length;ti2++){
    if(pip(players[pi2].hand[ti2])>maxP){maxP=pip(players[pi2].hand[ti2]);first=pi2}}}
  if(first===-1)first=0;

  G={players:players,boneyard:tiles,
    chain:[],   /* placed tile records */
    /* Head = left end of chain, Tail = right end */
    head:{x:BCX,y:BCY,dir:'L',val:null}, /* where next left tile attaches */
    tail:{x:BCX,y:BCY,dir:'R',val:null}, /* where next right tile attaches */
    numBots:numBots,cur:first,over:false,isFirst:true,passStreak:0};
  SEL=-1;
  /* Reset zoom */
  resetZoom();
}

/* ── PLACE TILE ON BOARD ──
   Each tile record: {a, b, x, y, w, h, cssRot, dbl, side}
   x,y = top-left corner of tile on board
   cssRot = CSS rotation in degrees (0, 90)
   
   Chain direction system:
   We have head (left end) and tail (right end).
   head.dir = direction new tiles extend AWAY from chain
   tail.dir = direction new tiles extend AWAY from chain
   
   For a normal (non-double) tile:
     - Tile is oriented along the chain direction
   For a double tile:
     - Tile is rotated 90° (perpendicular)
   
   Snake turning: when tail goes too far RIGHT → next tile goes DOWN
   then next segment goes LEFT, etc.
── */

function placeChain(player,tIdx,side){
  var t=player.hand[tIdx],rA=t.a,rB=t.b;
  STATS.tilesPlayed++;

  if(G.isFirst){
    /* First tile: center, going right */
    var dbl=(t.a===t.b);
    var w=dbl?DW:TW,h=dbl?DH:TH;
    var x=BCX-w/2,y=BCY-h/2;
    G.chain.push({a:rA,b:rB,x:x,y:y,w:w,h:h,dbl:dbl,side:'first'});
    G.head={x:x,y:y+h/2,dir:'L',val:rA};
    G.tail={x:x+w,y:y+h/2,dir:'R',val:rB};
    G.isFirst=false;
  } else if(side==='L'){
    /* Orient so connecting end = openL (head.val) */
    if(t.a===G.head.val){rA=t.b;rB=t.a}else{rA=t.a;rB=t.b}
    /* rB connects to head, rA is new open */
    var rec=attachToHead(rA,rB,t.a===t.b||rA===rB);
    G.chain.unshift(rec);
    G.head.val=rA;
  } else {
    /* Orient so connecting end = openR (tail.val) */
    if(t.a===G.tail.val){rA=t.a;rB=t.b}else{rA=t.b;rB=t.a}
    /* rA connects to tail, rB is new open */
    var rec2=attachToTail(rA,rB,t.a===t.b||rA===rB);
    G.chain.push(rec2);
    G.tail.val=rB;
  }

  player.hand.splice(tIdx,1);
  G.passStreak=0;SEL=-1;
  SFX.place();renderBoard();renderHUD();

  /* Score popup */
  if(!G.isFirst&&G.head.val!==null&&G.tail.val!==null){
    var es=G.head.val+G.tail.val;
    if(es>0&&es%5===0)scorePop(es)}
}

/* Attach a new tile to the TAIL (right/current end) */
function attachToTail(rA,rB,dbl){
  var end=G.tail,dir=end.dir;
  /* Tile dimensions depend on: dbl + direction */
  /* Normal tile: long axis along dir */
  /* Double tile: short axis along dir (perpendicular) */
  var tw,th,nx,ny,cssRot=0;

  if(dbl){
    /* Double: always perpendicular. w=DW, h=DH regardless */
    tw=DW;th=DH;
    if(dir==='R'||dir==='L'){
      /* chain going horizontal → double is vertical */
      nx=end.x;ny=end.y-DH/2;
    } else {
      /* chain going vertical → double is horizontal */
      tw=DH;th=DW;
      nx=end.x-DH/2;ny=end.y;
    }
    /* After placing double, cursor advances same direction */
    advanceTail(dir,dbl?tw:tw,dbl?th:th,nx,ny);
  } else {
    /* Normal tile: oriented along dir */
    if(dir==='R'){tw=TW;th=TH;nx=end.x;ny=end.y-TH/2;}
    else if(dir==='L'){tw=TW;th=TH;nx=end.x-TW;ny=end.y-TH/2;}
    else if(dir==='D'){tw=TH;th=TW;nx=end.x-TH/2;ny=end.y;}
    else{tw=TH;th=TW;nx=end.x-TH/2;ny=end.y-TW;} /* U */
    advanceTail(dir,tw,th,nx,ny);
  }
  return{a:rA,b:rB,x:nx,y:ny,w:tw,h:th,dbl:dbl,dir:dir,side:'tail'};
}

function advanceTail(dir,tw,th,nx,ny){
  var next;
  if(dir==='R'){
    next={x:nx+tw,y:ny+th/2};
    /* Check snake turn: if too far right */
    if(next.x>BCX+SNAKE_W){
      /* Turn down: next tile will go DOWN */
      G.tail={x:nx+tw/2,y:ny+th,dir:'D',val:G.tail.val};return}
  }else if(dir==='L'){
    next={x:nx,y:ny+th/2};
    if(next.x<BCX-SNAKE_W){
      /* Turn up */
      G.tail={x:nx+tw/2,y:ny,dir:'U',val:G.tail.val};return}
  }else if(dir==='D'){
    next={x:nx+tw/2,y:ny+th};
    /* After going down one tile, turn left */
    G.tail={x:nx,y:ny+th/2,dir:'L',val:G.tail.val};return;
  }else{ /* U */
    next={x:nx+tw/2,y:ny};
    G.tail={x:nx+tw,y:ny+th/2,dir:'R',val:G.tail.val};return;
  }
  G.tail={x:next.x,y:next.y,dir:dir,val:G.tail.val};
}

/* Attach a new tile to the HEAD (left end) */
function attachToHead(rA,rB,dbl){
  var end=G.head,dir=end.dir;
  var tw,th,nx,ny;
  /* Head dir is opposite: 'L' means we place tiles going further left */
  if(dbl){
    tw=DW;th=DH;
    if(dir==='L'||dir==='R'){nx=end.x-DW;ny=end.y-DH/2;}
    else{tw=DH;th=DW;nx=end.x-DH/2;ny=end.y-DW;}
    advanceHead(dir,tw,th,nx,ny);
  } else {
    if(dir==='L'){tw=TW;th=TH;nx=end.x-TW;ny=end.y-TH/2;}
    else if(dir==='R'){tw=TW;th=TH;nx=end.x;ny=end.y-TH/2;}
    else if(dir==='U'){tw=TH;th=TW;nx=end.x-TH/2;ny=end.y-TW;}
    else{tw=TH;th=TW;nx=end.x-TH/2;ny=end.y;} /* D */
    advanceHead(dir,tw,th,nx,ny);
  }
  return{a:rA,b:rB,x:nx,y:ny,w:tw,h:th,dbl:dbl,dir:dir,side:'head'};
}

function advanceHead(dir,tw,th,nx,ny){
  if(dir==='L'){
    var cx=nx;
    if(cx<BCX-SNAKE_W){G.head={x:nx+tw/2,y:ny,dir:'U',val:G.head.val};return}
    G.head={x:nx,y:ny+th/2,dir:dir,val:G.head.val};
  }else if(dir==='R'){
    var cx2=nx+tw;
    if(cx2>BCX+SNAKE_W){G.head={x:nx+tw/2,y:ny+th,dir:'D',val:G.head.val};return}
    G.head={x:nx+tw,y:ny+th/2,dir:dir,val:G.head.val};
  }else if(dir==='U'){
    G.head={x:nx+tw,y:ny+th/2,dir:'R',val:G.head.val};
  }else{
    G.head={x:nx,y:ny+th/2,dir:'L',val:G.head.val};
  }
}

/* ── VALID MOVES ── */
function validMoves(hand,oL,oR,isFirst){
  if(isFirst){var all=[];for(var i=0;i<hand.length;i++)all.push(i);return all}
  var out=[];
  for(var i=0;i<hand.length;i++){var t=hand[i];
    if(t.a===oL||t.b===oL||t.a===oR||t.b===oR)out.push(i)}
  return out}

/* ── BOT AI ── */
function botMove(p){
  var oL=G.head.val,oR=G.tail.val;
  var valid=validMoves(p.hand,oL,oR,G.isFirst);
  if(!valid.length)return false;
  var best=null,bestSc=-Infinity;
  for(var vi=0;vi<valid.length;vi++){
    var idx=valid[vi],t=p.hand[idx],dbl=(t.a===t.b);
    var sides=[];
    if(G.isFirst){sides.push('R')}
    else{if(t.a===oL||t.b===oL)sides.push('L');if(t.a===oR||t.b===oR)sides.push('R')}
    for(var si=0;si<sides.length;si++){
      var sc=pip(t)*9+(dbl?7:0);
      var newOpen=G.isFirst?t.b:(sides[si]==='L'?(t.a===oL?t.b:t.a):(t.a===oR?t.b:t.a));
      if(newOpen===6||newOpen===0)sc-=4;
      if(sc>bestSc){bestSc=sc;best={idx:idx,side:sides[si]}}}}
  if(best){placeChain(p,best.idx,best.side);return true}return false}

/* ── BONEYARD ── */
function getReserve(){return G.players.length<=2?2:1}
function byardOk(){return G.boneyard.length>getReserve()}
function drawTile(p){
  if(!byardOk())return null;
  var t=G.boneyard.shift();p.hand.push(t);SFX.draw();renderBoneyard();return t}

/* ── BLOCKED ── */
function isBlocked(){
  if(byardOk())return false;
  var oL=G.head.val,oR=G.tail.val;
  for(var i=0;i<G.players.length;i++)
    if(validMoves(G.players[i].hand,oL,oR,G.isFirst).length>0)return false;
  return true}

/* ── SCORING ── */
function rnd5(n){return Math.round(n/5)*5}
function endHand(winIdx,blocked){
  G.over=true;STATS.roundsPlayed++;
  var w=G.players[winIdx],bonus;
  if(blocked){var mine=hpip(w),all=G.players.reduce(function(s,p){return s+hpip(p)},0);bonus=rnd5(all-mine)}
  else{var opp=0;for(var i=0;i<G.players.length;i++)if(i!==winIdx)opp+=hpip(G.players[i]);bonus=rnd5(opp)}
  w.score+=bonus;
  if(winIdx===0){STATS.wins++;SFX.win()}else{STATS.losses++;SFX.lose()}
  STATS.gamesPlayed++;renderHUD();
  setTimeout(function(){showGO(winIdx,bonus,blocked)},350)}

/* ── TURN ENGINE ── */
function nextPlayer(){G.cur=(G.cur+1)%G.players.length;runTurn()}
function runTurn(){
  if(G.over)return;
  var p=G.players[G.cur];renderHUD();renderTurnBadge(p);
  if(p.hand.length===0){endHand(p.id,false);return}
  if(p.bot){setSt('⏳',p.name+' is thinking…');setBotThinking(p.id,true);
    TMR=setTimeout(function(){doBotTurn(p)},880+Math.random()*380)}
  else{setBotThinking(-1,false);SFX.yours();doHumanTurn(p)}}

function doBotTurn(p){
  setBotThinking(p.id,false);
  var moved=botMove(p);
  if(!moved){
    var draws=0;
    while(!moved&&draws<28){if(!byardOk())break;drawTile(p);renderBotHands();moved=botMove(p);draws++}
    if(!moved){G.passStreak=(G.passStreak||0)+1;setSt('⏭️',p.name+' has no moves — passing.');SFX.pass();
      if(G.passStreak>=G.players.length||isBlocked()){setTimeout(blockEnd,700);return}
    }else{G.passStreak=0}}
  renderBotHands();
  if(p.hand.length===0){endHand(p.id,false);return}
  if(isBlocked()){blockEnd();return}
  setTimeout(nextPlayer,520)}

function doHumanTurn(p){
  var oL=G.head.val,oR=G.tail.val;
  var valid=validMoves(p.hand,oL,oR,G.isFirst);
  if(valid.length>0){setSt('🟡','Your turn — tap a glowing tile to play.');renderHand(valid)}
  else if(byardOk()){setSt('🃏','No valid moves — tap the Boneyard to draw.');renderHand([])}
  else{G.passStreak=(G.passStreak||0)+1;setSt('⏭️','No moves, boneyard empty — turn passed.');SFX.pass();renderHand([]);
    if(G.passStreak>=G.players.length||isBlocked()){setTimeout(blockEnd,800)}
    else{setTimeout(nextPlayer,1100)}}}

function blockEnd(){
  var minP=Infinity,minI=0;
  for(var i=0;i<G.players.length;i++){var v=hpip(G.players[i]);if(v<minP){minP=v;minI=i}}
  endHand(minI,true)}

/* ── HUMAN ACTIONS ── */
function tileClick(idx){
  if(G.cur!==0||G.over)return;
  var p=G.players[0],oL=G.head.val,oR=G.tail.val;
  var valid=validMoves(p.hand,oL,oR,G.isFirst);
  if(valid.indexOf(idx)===-1){SFX.bad();return}
  SFX.click();
  var t=p.hand[idx];
  if(G.isFirst){placeChain(p,idx,'R');afterHuman(p);return}
  var canL=(t.a===oL||t.b===oL),canR=(t.a===oR||t.b===oR);
  if(canL&&canR&&oL!==oR){
    SEL=idx;renderHand(valid);
    document.getElementById('sbL').textContent='◀ Left ('+oL+')';
    document.getElementById('sbR').textContent='Right ('+oR+') ▶';
    document.getElementById('sbar').classList.remove('off');
    setSt('🔀','Choose which end of the chain to play on:');
  }else{SEL=-1;placeChain(p,idx,canL?'L':'R');afterHuman(p)}}

function doSide(side){if(SEL===-1)return;SFX.click();var p=G.players[0];hideSB();placeChain(p,SEL,side);SEL=-1;afterHuman(p)}
function cancelSide(){SFX.click();SEL=-1;hideSB()}
function hideSB(){document.getElementById('sbar').classList.add('off')}
function afterHuman(p){hideSB();SEL=-1;if(p.hand.length===0){endHand(0,false);return}if(isBlocked()){blockEnd();return}setTimeout(nextPlayer,360)}

function playerDraw(){
  if(G.cur!==0||G.over)return;
  var p=G.players[0],oL=G.head.val,oR=G.tail.val;
  var valid=validMoves(p.hand,oL,oR,G.isFirst);
  if(valid.length>0){SFX.bad();setSt('⚠️','You have playable tiles — tap a glowing one!');
    var tls=document.querySelectorAll('.tile.play');
    for(var i=0;i<tls.length;i++){(function(el){el.style.transform='translateY(-13px) scale(1.1)';
      setTimeout(function(){el.style.transform=''},300)})(tls[i])};return}
  if(!byardOk()){G.passStreak=(G.passStreak||0)+1;setSt('⏭️','Boneyard empty — passing your turn.');SFX.pass();
    setTimeout(function(){if(isBlocked()||G.passStreak>=G.players.length){blockEnd();return}nextPlayer()},900);return}
  var drawn=drawTile(p);
  if(drawn){toast('Drew: '+drawn.a+'-'+drawn.b);
    var v2=validMoves(p.hand,G.head.val,G.tail.val,G.isFirst);renderHand(v2);
    setSt(v2.length?'✅':'🃏',v2.length?'Tile drawn! Tap it to play.':"No match — draw again or wait.")}}

/* ── RENDER: BOARD ── */
function renderBoard(){
  var board=document.getElementById('board');board.innerHTML='';
  if(!G.chain||!G.chain.length)return;
  var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(var i=0;i<G.chain.length;i++){
    var rec=G.chain[i],dbl=rec.dbl;
    /* Determine visual orientation: if tile is tall (h>w) → vertical, else horizontal */
    var isVert=(rec.h>rec.w);
    var el=mkTile(rec.a,rec.b,{horiz:!isVert,board:true});
    el.classList.add('btile');
    el.style.left=rec.x+'px';el.style.top=rec.y+'px';
    el.style.width=rec.w+'px';el.style.height=rec.h+'px';
    el.style.animationDelay=(i*18)+'ms';
    board.appendChild(el);
    minX=Math.min(minX,rec.x);maxX=Math.max(maxX,rec.x+rec.w);
    minY=Math.min(minY,rec.y);maxY=Math.max(maxY,rec.y+rec.h)}
  /* Auto-pan to keep chain centered */
  centerOnChain(minX,maxX,minY,maxY)}

/* ── ZOOM / PAN SYSTEM ── */
var zoom=1,panX=0,panY=0;
var ZOOM_MIN=0.25,ZOOM_MAX=3;

function applyTransform(){
  var bc=document.getElementById('bcanvas');
  if(!bc)return;
  bc.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')';
  var pct=document.getElementById('zoom-pct');
  if(pct)pct.textContent=Math.round(zoom*100)+'%'}

function doZoom(factor,cx,cy){
  var bvp=document.getElementById('bvp');if(!bvp)return;
  if(cx===undefined){cx=bvp.clientWidth/2;cy=bvp.clientHeight/2}
  var newZoom=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,zoom*factor));
  /* Zoom toward (cx,cy) in viewport */
  var ratio=newZoom/zoom;
  panX=cx-(cx-panX)*ratio;
  panY=cy-(cy-panY)*ratio;
  zoom=newZoom;applyTransform()}

function resetZoom(){
  zoom=1;
  var bvp=document.getElementById('bvp');
  if(!bvp){panX=0;panY=0;applyTransform();return}
  /* Center on board center */
  panX=bvp.clientWidth/2-BCX;
  panY=bvp.clientHeight/2-BCY;
  applyTransform()}

function centerOnChain(minX,maxX,minY,maxY){
  var bvp=document.getElementById('bvp');if(!bvp)return;
  var chainCX=(minX+maxX)/2,chainCY=(minY+maxY)/2;
  /* Smoothly pan to keep chain visible, don't change zoom */
  var targetPanX=bvp.clientWidth/2-chainCX*zoom;
  var targetPanY=bvp.clientHeight/2-chainCY*zoom;
  /* Lerp */
  panX=panX+(targetPanX-panX)*.35;
  panY=panY+(targetPanY-panY)*.35;
  applyTransform()}

/* ── INPUT: MOUSE WHEEL ZOOM ── */
(function(){
  var bvp=function(){return document.getElementById('bvp')};
  document.addEventListener('wheel',function(e){
    var b=bvp();if(!b||!b.contains(e.target))return;
    e.preventDefault();
    var rect=b.getBoundingClientRect();
    var cx=e.clientX-rect.left,cy=e.clientY-rect.top;
    var factor=e.deltaY<0?1.1:0.909;
    doZoom(factor,cx,cy)},{passive:false});
})();

/* ── INPUT: MOUSE DRAG PAN ── */
(function(){
  var dn=false,lx,ly;
  document.addEventListener('mousedown',function(e){
    var b=document.getElementById('bvp');if(!b||!b.contains(e.target))return;
    if(e.target.closest&&e.target.closest('.tile'))return;
    dn=true;lx=e.clientX;ly=e.clientY;e.preventDefault()});
  document.addEventListener('mousemove',function(e){
    if(!dn)return;var dx=e.clientX-lx,dy=e.clientY-ly;
    panX+=dx;panY+=dy;lx=e.clientX;ly=e.clientY;applyTransform()});
  document.addEventListener('mouseup',function(){dn=false});
  document.addEventListener('mouseleave',function(){dn=false});
})();

/* ── INPUT: TOUCH (pinch-zoom + drag pan) ── */
(function(){
  var t1=null,t2=null,lastDist=null,lastMx,lastMy;
  function getPos(touches){
    var bvp=document.getElementById('bvp');if(!bvp)return null;
    var rect=bvp.getBoundingClientRect();
    return{x:touches[0].clientX-rect.left,y:touches[0].clientY-rect.top}}
  function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
  document.addEventListener('touchstart',function(e){
    var bvp=document.getElementById('bvp');if(!bvp||!bvp.contains(e.target))return;
    /* Allow tile taps: if target is a tile, don't intercept */
    if(e.touches.length===1&&e.target.closest&&e.target.closest('.tile.play'))return;
    e.preventDefault();
    if(e.touches.length===1){t1=e.touches[0];t2=null;lastDist=null;
      lastMx=t1.clientX;lastMy=t1.clientY}
    else if(e.touches.length===2){t1=e.touches[0];t2=e.touches[1];
      lastDist=dist(t1,t2)}},{passive:false});
  document.addEventListener('touchmove',function(e){
    var bvp=document.getElementById('bvp');if(!bvp||!bvp.contains(e.target))return;
    e.preventDefault();
    if(e.touches.length===2&&t2!==null){
      var d=dist(e.touches[0],e.touches[1]);
      if(lastDist!==null){
        var factor=d/lastDist;
        var rect=bvp.getBoundingClientRect();
        var mx=(e.touches[0].clientX+e.touches[1].clientX)/2-rect.left;
        var my=(e.touches[0].clientY+e.touches[1].clientY)/2-rect.top;
        doZoom(factor,mx,my)}lastDist=d}
    else if(e.touches.length===1&&t2===null){
      var dx=e.touches[0].clientX-lastMx,dy=e.touches[0].clientY-lastMy;
      panX+=dx;panY+=dy;lastMx=e.touches[0].clientX;lastMy=e.touches[0].clientY;
      applyTransform()}},{passive:false});
  document.addEventListener('touchend',function(e){
    if(e.touches.length===0){t1=null;t2=null;lastDist=null}
    else if(e.touches.length===1){t2=null;lastDist=null;t1=e.touches[0];
      lastMx=t1.clientX;lastMy=t1.clientY}},{passive:false});
})();

/* ── RENDER: PLAYER HAND ── */
function renderHand(validSet){
  validSet=validSet||[];var ph=document.getElementById('ph');ph.innerHTML='';
  var p=G.players[0];if(!p)return;
  var vs={};for(var i=0;i<validSet.length;i++)vs[validSet[i]]=true;

    el.style.animation='tpl .28s cubic-bezier(.34,1.56,.64,1) '+(idx*36)+'ms both';
    ph.appendChild(el)})(p.hand[i],i)}}

/* ── RENDER: BOT ZONES ── */
function renderBotZones(){

  var slots=BZ_SLOTS[G.numBots]||['bz0'];

function renderBotHands(){

    var bn=document.getElementById('bn-'+p.id),bc=document.getElementById('bc-'+p.id);

function fillBotHand(p){
  var hel=document.getElementById('bh-'+p.id);if(!hel)return;hel.innerHTML='';
  for(var i=0;i<p.hand.length;i++){var b=document.createElement('div');b.className='btbk';hel.appendChild(b)}}
function setBotThinking(pid,show){
  for(var i=0;i<G.players.length;i++){var p=G.players[i];
    var av=document.getElementById('av-'+p.id),bn=document.getElementById('bn-'+p.id);
    if(av){if(show&&p.id===pid)av.classList.add('on');else av.classList.remove('on')}
    if(bn){var td=bn.querySelector('.tdots');
      if(show&&p.id===pid){if(!td){var d=document.createElement('span');d.className='tdots';

/* ── CONFETTI ── */
function launchConfetti(){
  var cv=document.getElementById('cnfc'),ctx=cv.getContext('2d');
  cv.width=cv.offsetWidth||400;cv.height=cv.offsetHeight||360;
  var W=cv.width,H=cv.height,pcs=[],fr=0;
  for(var i=0;i<88;i++)pcs.push({x:Math.random()*W,y:-8-Math.random()*75,
    w:5+Math.random()*8,h:3+Math.random()*4,rot:Math.random()*360,
    vx:(Math.random()-.5)*3.2,vy:1.8+Math.random()*3.2,vr:(Math.random()-.5)*7,
    col:'hsl('+Math.floor(Math.random()*360)+',78%,64%)',a:1});
  function draw(){ctx.clearRect(0,0,W,H);var alive=false;
    for(var i=0;i<pcs.length;i++){var p=pcs[i];p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      if(p.y>H)p.a-=.05;if(p.a>0)alive=true;
      ctx.save();ctx.globalAlpha=Math.max(0,p.a);ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.col;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
    if(alive&&fr++<200)requestAnimationFrame(draw);else ctx.clearRect(0,0,W,H)}draw()}

/* ── GAME OVER ── */
function showGO(winIdx,bonus,blocked){
  var w=G.players[winIdx],youWin=(w.id===0);
  document.getElementById('go-trophy').textContent=youWin?'🏆':w.emoji;
  document.getElementById('go-title').textContent=youWin?'You Win!':w.name+' Wins!';
  document.getElementById('go-msg').textContent=
    (blocked?'Game blocked — fewest pips wins! ':(youWin?'You played all tiles! ':w.name+' played all tiles. '))
    +'Bonus: +'+bonus+' points.';
  var sc=document.getElementById('go-sc');
  sc.innerHTML='<div class="grow" style="font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(201,168,76,.5);padding-bottom:4px"><span>Player</span><span>Score &amp; Pips</span></div>';
  var sorted=G.players.slice().sort(function(a,b){return b.score-a.score});
  for(var i=0;i<sorted.length;i++){var p=sorted[i];
    var r=document.createElement('div');r.className='grow'+(p.id===winIdx?' w':'');
    r.innerHTML='<div class="grow-l"><span>'+p.emoji+'</span><span>'+p.name+'</span>'+(p.id===winIdx?'<span style="font-size:.7rem">🥇</span>':'')+'</div>'+
      '<span>'+p.score+' pts <span class="grow-pips">('+hpip(p)+' pips)</span></span>';sc.appendChild(r)}
  document.getElementById('gov').classList.remove('off');
  if(youWin)setTimeout(launchConfetti,220)}

  for(var i=0;i<pairs.length;i++){(function(a,b,idx){
    var t=mkTile(a,b,{});

      'transition:opacity .4s ease '+idx*78+'ms,transform .4s ease '+idx*78+'ms;transform:translateY(12px)';
