<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#ff9ff3"/>
    </linearGradient>
    <linearGradient id="tileBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0e6d3"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Funky background -->
  <rect width="800" height="300" rx="24" fill="url(#bg)"/>

  <!-- Comic action lines behind the character -->
  <g opacity="0.25" stroke="#fff" stroke-width="3" stroke-linecap="round">
    <line x1="40" y1="80" x2="120" y2="60"/>
    <line x1="30" y1="110" x2="130" y2="100"/>
    <line x1="35" y1="140" x2="125" y2="135"/>
    <line x1="45" y1="170" x2="115" y2="175"/>
    <line x1="50" y1="200" x2="110" y2="215"/>
  </g>

  <!-- Main character: Panicking Domino -->
  <g filter="url(#shadow)" transform="translate(60, 50)">
    <!-- Domino body -->
    <rect x="0" y="0" width="100" height="160" rx="12" fill="url(#tileBody)" stroke="#2d3436" stroke-width="3"/>
    <line x1="50" y1="0" x2="50" y2="160" stroke="#2d3436" stroke-width="3"/>

    <!-- Wide panicked eyes (top half) -->
    <circle cx="20" cy="35" r="14" fill="white" stroke="#2d3436" stroke-width="2.5"/>
    <circle cx="22" cy="35" r="7" fill="#2d3436"/>
    <circle cx="24" cy="32" r="2.5" fill="white"/>

    <circle cx="80" cy="35" r="14" fill="white" stroke="#2d3436" stroke-width="2.5"/>
    <circle cx="78" cy="35" r="7" fill="#2d3436"/>
    <circle cx="76" cy="32" r="2.5" fill="white"/>

    <!-- Panic eyebrows -->
    <line x1="6" y1="16" x2="34" y2="12" stroke="#2d3436" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="66" y1="12" x2="94" y2="16" stroke="#2d3436" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Screaming mouth -->
    <ellipse cx="50" cy="68" rx="18" ry="14" fill="#2d3436"/>
    <ellipse cx="50" cy="64" rx="12" ry="6" fill="#ff7675"/>
    <ellipse cx="50" cy="72" rx="8" ry="5" fill="#fab1a0"/>

    <!-- Sweat drops -->
    <g fill="#74b9ff">
      <path d="M120 20 Q124 10 128 20 Q124 28 120 20Z"/>
      <path d="M135 45 Q138 37 141 45 Q138 51 135 45Z"/>
      <path d="M118 55 Q121 48 124 55 Q121 60 118 55Z"/>
    </g>

    <!-- Trembling lines -->
    <g stroke="#2d3436" stroke-width="2" stroke-linecap="round" opacity="0.5">
      <path d="M-10 40 Q-5 35 0 40" fill="none"/>
      <path d="M-12 80 Q-7 75 -2 80" fill="none"/>
      <path d="M-8 120 Q-3 115 2 120" fill="none"/>
      <path d="M100 30 Q105 25 110 30" fill="none"/>
      <path d="M102 90 Q107 85 112 90" fill="none"/>
      <path d="M100 140 Q105 135 110 140" fill="none"/>
    </g>

    <!-- Bottom pips (3|5) -->
    <circle cx="20" cy="115" r="6" fill="#e74c3c"/>
    <circle cx="32" cy="130" r="6" fill="#e74c3c"/>
    <circle cx="20" cy="145" r="6" fill="#e74c3c"/>

    <circle cx="62" cy="105" r="5.5" fill="#2d3436"/>
    <circle cx="78" cy="105" r="5.5" fill="#2d3436"/>
    <circle cx="70" cy="130" r="5.5" fill="#2d3436"/>
    <circle cx="62" cy="150" r="5.5" fill="#2d3436"/>
    <circle cx="78" cy="150" r="5.5" fill="#2d3436"/>
  </g>

  <!-- Evil domino sneaking up -->
  <g filter="url(#shadow)" transform="translate(185, 130) rotate(15)">
    <rect x="0" y="0" width="55" height="85" rx="8" fill="#fffef9" stroke="#2d3436" stroke-width="2.5"/>
    <line x1="27.5" y1="0" x2="27.5" y2="85" stroke="#2d3436" stroke-width="2.5"/>
    <!-- Mischievous eyes -->
    <circle cx="12" cy="18" r="6" fill="white" stroke="#2d3436" stroke-width="1.5"/>
    <circle cx="14" cy="18" r="3" fill="#2d3436"/>
    <circle cx="43" cy="18" r="6" fill="white" stroke="#2d3436" stroke-width="1.5"/>
    <circle cx="41" cy="18" r="3" fill="#2d3436"/>
    <!-- Evil grin -->
    <path d="M10 32 Q27.5 46 45 32" fill="none" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
    <!-- 2 pips each side -->
    <circle cx="10" cy="52" r="4" fill="#2d3436"/>
    <circle cx="10" cy="72" r="4" fill="#2d3436"/>
    <circle cx="45" cy="52" r="4" fill="#2d3436"/>
    <circle cx="45" cy="72" r="4" fill="#2d3436"/>
  </g>

  <!-- Game Title -->
  <text x="420" y="100" font-family="'Fredoka One', 'Bangers', 'Comic Sans MS', cursive, sans-serif" font-size="68" font-weight="900" fill="#2d3436" text-anchor="middle" filter="url(#textShadow)">
    DOMINOOOO
  </text>

  <!-- Tagline -->
  <text x="420" y="145" font-family="'Fredoka One', 'Comic Sans MS', cursive, sans-serif" font-size="18" fill="#fff" text-anchor="middle" filter="url(#textShadow)" letter-spacing="1">
    Oh no... here it comes! 🫣
  </text>

  <!-- Button: PLAY IF YOU DARE -->
  <g transform="translate(320, 175)">
    <rect x="0" y="0" width="200" height="48" rx="24" fill="#2d3436" filter="url(#shadow)"/>
    <text x="100" y="31" font-family="'Fredoka One', 'Comic Sans MS', cursive, sans-serif" font-size="18" fill="#feca57" text-anchor="middle" font-weight="bold">PLAY IF YOU DARE</text>
  </g>

  <!-- Falling dominoes -->
  <g transform="translate(600, 60) rotate(25)">
    <rect x="0" y="0" width="40" height="60" rx="6" fill="url(#tileBody)" stroke="#2d3436" stroke-width="2"/>
    <line x1="20" y1="0" x2="20" y2="60" stroke="#2d3436" stroke-width="2"/>
    <circle cx="8" cy="14" r="3" fill="#e74c3c"/>
    <circle cx="32" cy="14" r="3" fill="#2d3436"/>
    <circle cx="20" cy="40" r="3" fill="#2d3436"/>
  </g>
  <g transform="translate(640, 90) rotate(45)">
    <rect x="0" y="0" width="35" height="50" rx="5" fill="#fffef9" stroke="#2d3436" stroke-width="2"/>
    <line x1="17.5" y1="0" x2="17.5" y2="50" stroke="#2d3436" stroke-width="2"/>
    <circle cx="7" cy="12" r="2.5" fill="#2d3436"/>
    <circle cx="28" cy="12" r="2.5" fill="#e74c3c"/>
    <circle cx="7" cy="32" r="2.5" fill="#e74c3c"/>
  </g>
  <g transform="translate(670, 130) rotate(65)">
    <rect x="0" y="0" width="30" height="44" rx="5" fill="url(#tileBody)" stroke="#2d3436" stroke-width="2"/>
    <line x1="15" y1="0" x2="15" y2="44" stroke="#2d3436" stroke-width="2"/>
    <circle cx="6" cy="10" r="2" fill="#2d3436"/>
    <circle cx="24" cy="10" r="2" fill="#e74c3c"/>
    <circle cx="15" cy="28" r="2" fill="#2d3436"/>
  </g>

  <!-- Emojis -->
  <text x="30" y="30" font-size="22">💀</text>
  <text x="740" y="40" font-size="20">😂</text>
  <text x="720" y="260" font-size="24">👀</text>
  <text x="50" y="260" font-size="18">🎯</text>
</svg>